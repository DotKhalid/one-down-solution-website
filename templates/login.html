{% extends 'base.html' %}{% block content %}<section class="section"><div class="container"><div class="login-box glass"><p class="eyebrow">ONEDOWN / PRIVATE WORKSPACE</p><h1>Welcome back.</h1><p class="muted">Sign in to manage your project enquiries.</p>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="username">Username</label><input class="form-control mb-4" id="username" name="username" autocomplete="username" required maxlength="80"><label class="form-label" for="password">Password</label><input class="form-control mb-4" type="password" id="password" name="password" autocomplete="current-password" required><button class="btn btn-primary w-100" type="submit">Sign in <span>→</span></button></form></div></div></section>{% endblock %}
